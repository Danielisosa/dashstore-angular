@if (cardProduct()) {
  <div class="group relative flex flex-col justify-between overflow-hidden rounded-2xl bg-base-100 border border-slate-800/50 shadow-xl transition-all duration-300 ease-out hover:-translate-y-2 hover:border-accent/40 hover:shadow-[0_0_25px_rgba(0,242,254,0.15)] animate-fadeUp" tabindex="0">

    <button class="absolute top-3 right-3 z-10 btn btn-circle btn-xs bg-base-100/80 backdrop-blur-md border-none text-slate-400 hover:text-error hover:scale-110 transition-all duration-200">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
      </svg>
    </button>

    <div class="relative overflow-hidden bg-white aspect-square flex items-center justify-center">
      <img
        [src]="cardProduct()!.images | productImage"
        [alt]="cardProduct()!.title"
        class="object-contain w-full h-full p-4 transition-transform duration-500 ease-out group-hover:scale-105"
        loading="lazy" />
    </div>

    <div class="flex flex-col flex-grow p-5 justify-between">
      <div>
        <h2
          [routerLink]="['/product', cardProduct()!.slug]"
          class="font-montserrat text-lg font-bold tracking-tight cursor-pointer line-clamp-1 text-slate-200 hover:text-accent transition-colors duration-200">
          {{ cardProduct()!.title }}
        </h2>

        <p class="mt-2 text-sm text-slate-400 line-clamp-2 min-h-[40px]">
          {{ cardProduct()!.description }}
        </p>
      </div>

      <div class="flex items-center justify-between mt-4 pt-3 border-t border-slate-800/60">
        <span class="text-lg font-black text-slate-100">$99.99</span>

        <a
          [routerLink]="['/product', cardProduct()!.slug]"
          class="inline-flex items-center gap-1 text-sm font-semibold text-accent transition-all duration-200 hover:gap-2 hover:underline">
          Ver detalle
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3 h-3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
          </svg>
        </a>
      </div>
    </div>

  </div>
}
