<!-- Contenedor Principal Flotante (Esquina inferior derecha) -->
<div class="fixed bottom-6 right-6 z-50 font-sans">

  <!-- 1. Botón para abrir el Chat (Cuando está cerrado) -->
  @if (!isOpen()) {
    <button
      (click)="toggleChat()"
      class="btn btn-circle btn-lg bg-base-100 border border-slate-700 text-accent shadow-2xl hover:border-accent hover:scale-110 hover:shadow-[0_0_25px_rgba(0,242,254,0.2)] transition-all duration-300 flex items-center justify-center"
      aria-label="Abrir Asistente de Compras">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
      </svg>
    </button>
  } @else {

    <!-- 2. Ventana de Chat Desplegada (Cuando está abierto) -->
    <div class="bg-base-100 w-80 sm:w-96 h-[500px] rounded-2xl shadow-2xl border border-slate-800 flex flex-col overflow-hidden animate-fadeUp">

      <!-- Cabecera alineada con la app -->
      <div class="bg-base-100/90 backdrop-blur-md border-b border-slate-800 p-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
          <span class="w-3 h-3 bg-accent rounded-full animate-pulse shadow-[0_0_10px_rgba(0,242,254,0.5)]"></span>
          <h3 class="font-montserrat font-bold text-sm text-slate-200">Asistente DashStore</h3>
        </div>
        <button
          (click)="toggleChat()"
          class="text-slate-400 hover:text-slate-100 focus:outline-none text-xl font-bold px-2 transition-colors">
          &times;
        </button>
      </div>

      <!-- Cuerpo de Mensajes con Scroll y diseño oscuro -->
      <div #scrollContainer class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-950/40">
        @for (msg of shopperService.messages(); track $index) {
          <div [class]="'flex ' + (msg.sender === 'user' ? 'justify-end' : 'justify-start')">
            <div [class]="'max-w-[80%] p-3 rounded-2xl text-sm leading-relaxed ' + (msg.sender === 'user' ? 'bg-accent/20 text-slate-100 border border-accent/30 rounded-br-none shadow-md' : 'bg-base-100 text-slate-300 border border-slate-800 rounded-bl-none shadow-sm')">
              <p class="whitespace-pre-wrap">{{ msg.text }}</p>
              <span [class]="'text-[10px] block mt-1 text-right ' + (msg.sender === 'user' ? 'text-accent/70' : 'text-slate-500')">
                {{ msg.timestamp | date:'shortTime' }}
              </span>
            </div>
          </div>
        }

        <!-- Indicador de carga estilizado -->
        @if (shopperService.isLoading()) {
          <div class="flex justify-start">
            <div class="bg-base-100 text-slate-400 border border-slate-800 p-3 rounded-2xl rounded-bl-none shadow-sm text-xs flex items-center space-x-1.5">
              <span class="w-2 h-2 bg-accent rounded-full animate-bounce"></span>
              <span class="w-2 h-2 bg-accent rounded-full animate-bounce [animation-delay:-.2s]"></span>
              <span class="w-2 h-2 bg-accent rounded-full animate-bounce [animation-delay:-.4s]"></span>
            </div>
          </div>
        }
      </div>

      <!-- Pie de página: Input y Botón integrados -->
      <div class="p-3 bg-base-100 border-t border-slate-800 flex items-center space-x-2">
        <input
          type="text"
          [ngModel]="userInputValue()"
          (ngModelChange)="userInputValue.set($event)"
          (keyup.enter)="sendMessage()"
          placeholder="Pregúntale al asistente..."
          class="flex-1 bg-slate-900 border border-slate-800 rounded-full px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-accent transition-colors">

        <button
          (click)="sendMessage()"
          [disabled]="shopperService.isLoading()"
          class="btn btn-circle bg-accent text-slate-950 hover:bg-accent/80 border-none disabled:opacity-50 transition-all flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
          </svg>
        </button>
      </div>

    </div>
  }
</div>
