<nav class="sticky top-0 z-50 w-full border-b border-slate-800/60 bg-slate-950/70 backdrop-blur-md transition-all duration-300" role="navigation" aria-label="Main navigation">
  <div class="container mx-auto flex items-center justify-between px-4 py-3">

    <div class="flex items-center gap-6">
      <button aria-label="Toggle menu" class="btn btn-ghost btn-sm btn-circle text-slate-300 lg:hidden hover:bg-slate-800/50">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h8m-8 6h16" />
        </svg>
      </button>

      <a routerLink="/" aria-label="Ir al inicio de DashStore" class="group flex items-center gap-2 text-xl font-montserrat font-black tracking-wider text-white">
        <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-gradient-to-br from-accent to-blue-600 shadow-[0_0_15px_rgba(0,242,254,0.3)] transition-transform duration-300 group-hover:scale-110">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-5 h-5" aria-hidden="true">
            <path fill="currentColor" d="M7 7V6a5 5 0 0 1 10 0v1h1a1 1 0 0 1 1 1v10a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V8a1 1 0 0 1 1-1h1zM9 7a3 3 0 0 1 6 0v1H9V7z"/>
          </svg>
        </div>
        <span class="bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent">DashStore</span>
      </a>

      <ul class="hidden lg:flex items-center gap-1">
        <li>
          <a routerLink="/gender/men" routerLinkActive="bg-slate-800/60 text-accent font-semibold border border-accent/20" class="px-4 py-2 text-sm text-slate-300 rounded-xl transition-all duration-200 hover:bg-slate-850 hover:text-white">Hombres</a>
        </li>
        <li>
          <a routerLink="/gender/women" routerLinkActive="bg-slate-800/60 text-accent font-semibold border border-accent/20" class="px-4 py-2 text-sm text-slate-300 rounded-xl transition-all duration-200 hover:bg-slate-850 hover:text-white">Mujeres</a>
        </li>
        <li>
          <a routerLink="/gender/kid" routerLinkActive="bg-slate-800/60 text-accent font-semibold border border-accent/20" class="px-4 py-2 text-sm text-slate-300 rounded-xl transition-all duration-200 hover:bg-slate-850 hover:text-white">Niños</a>
        </li>
      </ul>
    </div>

    <div class="flex items-center gap-3">

      <form role="search" aria-label="Buscar productos" class="hidden md:block relative group">
        <label for="nav-search" class="sr-only">Buscar productos</label>
        <input
          id="nav-search"
          type="search"
          placeholder="Buscar prendas..."
          class="w-48 lg:w-64 pl-9 pr-4 py-1.5 text-sm rounded-full bg-slate-900 border border-slate-800 text-slate-200 placeholder-slate-500 transition-all duration-300 focus:w-56 lg:focus:w-72 focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent focus:shadow-[0_0_15px_rgba(0,242,254,0.1)]" />
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 absolute left-3 top-2.5 text-slate-500 group-focus-within:text-accent transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </form>

      <button aria-label="Ver favoritos" class="btn btn-ghost btn-sm btn-circle relative text-slate-400 hover:text-error hover:bg-slate-800/50">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
        </svg>
        <span class="absolute -top-1 -right-1 flex h-4 w-4 items-center justify-center rounded-full bg-error text-[10px] font-bold text-white shadow-sm">0</span>
      </button>

      <button aria-label="Ver carrito" class="btn btn-ghost btn-sm btn-circle relative text-slate-400 hover:text-accent hover:bg-slate-800/50">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4m0 0H4.5A2.25 2.25 0 0 0 2.25 12.75v5.625c0 1.036.84 1.875 1.875 1.875h15.75c1.036 0 1.875-.84 1.875-1.875V12.75A2.25 2.25 0 0 0 19.5 10.5h-3.75z" />
        </svg>
        <span class="absolute -top-1 -right-1 flex h-4 w-4 items-center justify-center rounded-full bg-accent text-[10px] font-bold text-slate-950 shadow-sm animate-pulse">0</span>
      </button>

      <div class="h-5 w-[1px] bg-slate-800 hidden sm:block"></div>

      <div class="flex items-center gap-2">
        @if(authService.isAdmin()) {
          <a routerLink="/admin" class="btn btn-ghost btn-sm text-accent rounded-xl hover:bg-accent/10">Panel</a>
        }

        @if(authService.authStatus() === 'authenticated'){
          <span class="hidden sm:inline text-xs font-medium text-slate-400 max-w-[100px] truncate">
            {{ authService.user()?.fullName }}
          </span>
          <button class="btn btn-sm btn-outline btn-error rounded-xl px-3" (click)="authService.logout()">
            Salir
          </button>
        }
        @else if (authService.authStatus() === 'not-authenticated') {
          <button type="button" (click)="goToLogin()" class="btn btn-sm btn-accent rounded-xl px-4 font-semibold text-slate-950 shadow-[0_0_15px_rgba(0,242,254,0.2)] hover:shadow-[0_0_25px_rgba(0,242,254,0.4)]">
            Login
          </button>
        }
        @else {
          <span class="loading loading-spinner loading-xs text-slate-500"></span>
        }
      </div>

    </div>
  </div>
</nav>
