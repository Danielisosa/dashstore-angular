<div class="w-full max-w-md mx-auto p-6 rounded-2xl bg-slate-900/30 border border-slate-900 backdrop-blur-md shadow-xl animate-fadeIn">

  <div class="text-center mb-6">
    <h2 class="text-2xl font-black font-montserrat text-white tracking-tight">Crea tu Cuenta</h2>
    <p class="text-xs text-slate-400 mt-1">Regístrate para empezar a administrar tu catálogo</p>
  </div>

  <form class="flex flex-col gap-3" [formGroup]="registerForm" (ngSubmit)="onSubmit()">

    <div class="flex flex-col gap-1">
      <label
        class="input bg-slate-950 border-slate-800 focus-within:border-accent focus-within:ring-1 focus-within:ring-accent flex items-center gap-3 px-3 py-2 rounded-xl transition-all h-11"
        [class.border-error]="registerForm.get('fullName')?.errors && registerForm.get('fullName')?.touched">
        <svg class="h-4 w-4 text-slate-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        <input
          type="text"
          class="grow bg-transparent text-sm text-slate-200 placeholder-slate-500 focus:outline-none"
          placeholder="Nombre de usuario"
          formControlName="fullName"
        />
      </label>
      <form-error-label [control]="registerForm.get('fullName')!"/>
    </div>

    <div class="flex flex-col gap-1">
      <label
        class="input bg-slate-950 border-slate-800 focus-within:border-accent focus-within:ring-1 focus-within:ring-accent flex items-center gap-3 px-3 py-2 rounded-xl transition-all h-11"
        [class.border-error]="registerForm.get('email')?.errors && registerForm.get('email')?.touched">
        <svg class="h-4 w-4 text-slate-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor">
            <rect width="20" height="16" x="2" y="4" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </g>
        </svg>
        <input
          type="email"
          class="grow bg-transparent text-sm text-slate-200 placeholder-slate-500 focus:outline-none"
          placeholder="Correo Electrónico"
          formControlName="email"
        />
      </label>
      <form-error-label [control]="registerForm.get('email')!"/>
    </div>

    <div class="flex flex-col gap-1">
      <label
        class="input bg-slate-950 border-slate-800 focus-within:border-accent focus-within:ring-1 focus-within:ring-accent flex items-center gap-3 px-3 py-2 rounded-xl transition-all h-11"
        [class.border-error]="registerForm.get('password')?.errors && registerForm.get('password')?.touched">
        <svg class="h-4 w-4 text-slate-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor">
            <path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"></path>
            <circle cx="16.5" cy="7.5" r=".5" fill="currentColor"></circle>
          </g>
        </svg>
        <input
          type="password"
          class="grow bg-transparent text-sm text-slate-200 placeholder-slate-500 focus:outline-none"
          placeholder="Contraseña"
          formControlName="password"
        />
      </label>
      <form-error-label [control]="registerForm.get('password')!"/>
    </div>

    <button
      class="btn h-11 min-h-11 bg-accent hover:bg-accent/90 text-slate-950 font-black border-none rounded-xl mt-2 transition-all duration-200 shadow-[0_0_15px_rgba(0,242,254,0.15)] hover:shadow-[0_0_25px_rgba(0,242,254,0.35)]"
      type="submit">
      Registrar Cuenta
    </button>

    <p class="text-xs text-slate-400 text-center mt-2">
      ¿Ya tienes cuenta?
      <a routerLink="/auth/login" class="text-accent font-bold hover:underline ml-1">Inicia sesión aquí</a>
    </p>

  </form>
</div>

@if(hasError()){
  <div role="alert" class="alert bg-error/10 border border-error/20 text-error text-xs font-semibold p-4 rounded-xl shadow-xl animate-fadeIn fixed bottom-5 right-5 w-80 flex gap-3 items-center backdrop-blur-md z-50">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0 stroke-current text-error" fill="none" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <span>{{ errorMessage() }}</span>
  </div>
}
